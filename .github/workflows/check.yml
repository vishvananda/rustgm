name: Reference and course checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Pinned Rust
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
      - name: Build and course tests
        run: make test test-report lint
      - name: Release invariants
        run: CARGO_TARGET_DIR="$PWD/obj/rust" cargo test --manifest-path dev/Cargo.toml --release --locked
      - name: Architecture and harness
        run: make setup-audit audit-rust test-harness test-upstream test-rustc
      - name: Oracle reproducibility
        run: |
          make ref-test
          git diff --exit-code -- ':(glob)pa*/tests/**' ':(glob)pa*/reference.json'
