name: Reference and course checks
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * *'
permissions:
  contents: read
concurrency:
  group: rustgm-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}
jobs:
  fast:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Pinned Rust
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
      - uses: actions/cache@v6
        with:
          path: |
            obj/rust/dev-fast
            obj/rust/private-lint
            obj/fast-audit.json
            ~/.cargo/registry
          key: dev-fast-${{ runner.os }}-rust-1.98-${{ hashFiles('dev/Cargo.lock', 'dev/Cargo.toml') }}-${{ github.sha }}
          restore-keys: |
            dev-fast-${{ runner.os }}-rust-1.98-${{ hashFiles('dev/Cargo.lock', 'dev/Cargo.toml') }}-
      - name: Audit setup
        run: make setup-audit
      - name: Five-minute development check
        run: RUST_TEST_NOCAPTURE=1 make fastcheck FAST_ARGS='--lib-case sema::declarations::structural_owners::tests::primitive_owner_permission_uses_actual_attributes_and_nominal_ownership --lib-case sema::declarations::structural_owners::tests::structural_members_use_full_self_and_real_receiver_adjustments --lib-case sema::declarations::structural_owners::tests::structural_duplicates_remain_demanded_without_weakening_nominal_coherence --lib-case sema::declarations::inherent_headers::tests::lookup_and_retirement_are_partitioned_by_nominal_and_name --lib-case sema::declarations::inherent_headers::tests::an_owner_publishes_all_names_and_duplicate_declarations_once --lib-case sema::declarations::inherent_headers::tests::structural_pending_names_preserve_mutability_and_empty_permission --lib-case sema::methods::names::tests::ordinary_members_keep_the_existing_storage_and_invalidate_only_their_index --lib-case sema::methods::names::tests::sibling_opaque_names_do_not_multiply_candidate_queries_by_declaration_width --lib-case sema::methods::names::tests::nested_use_walks_only_its_own_ancestry_and_cold_shapes_follow_exact_contexts --lib-case sema::methods::names::tests::identity_lookup_exhaustion_counts_the_attempt_before_returning --lib-case sema::methods::names::tests::structural_cold_warm_and_failed_queries_share_owner_work_with_nominal_noise --lib-case sema::methods::names::tests::actual_source_receiver_and_path_sites_retain_their_identifier_context --lib-case sema::methods::names::tests::actual_impl_containers_adjust_privacy_without_reusing_another_callers_access'
      - name: Harness, audit cache and upstream contracts
        run: make test-harness test-upstream && obj/audit-venv/bin/python -m unittest discover -s scripts/audit_tests -v
      - name: Retain focused evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fastcheck-evidence
          path: obj/qualification/fast
          if-no-files-found: ignore
          retention-days: 7
  qualification:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - name: Pinned Rust
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
      - name: Lint, architecture and harness
        run: make fmt-check setup-audit audit-rust lint test-harness test-upstream
      - name: Independent host build graph
        run: make test-host-builds
      - name: Release and course tests
        run: make test
      - name: Native maintainer qualification
        run: |
          python3 scripts/storage.py run --no-prune -- python3 scripts/setup_backend.py
          make test-maintainer-native
      - name: Debug invariants
        run: make test-debug-invariants
      - name: Independent Rust qualification
        run: make test-rustc
