[package]
name = "rustgm"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false
autotests = false
license = "MIT OR Apache-2.0"

[lib]
path = "src/lib.rs"

[[bin]]
name = "rustgm"
path = "bin/rustgm.rs"

[dependencies]
unicode-ident = "=1.0.24"
unicode-normalization = "=0.1.25"

[features]
object-interop-tests = []

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"
unfulfilled_lint_expectations = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
exit = "deny"
mem_forget = "deny"

[profile.release]
debug = 1

[[test]]
name = "suite_frontend"
path = "tests/suites/frontend/mod.rs"

[[test]]
name = "suite_linking"
path = "tests/suites/linking/mod.rs"

[[test]]
name = "suite_closures"
path = "tests/suites/closures/mod.rs"

[[test]]
name = "suite_patterns"
path = "tests/suites/patterns/mod.rs"

[[test]]
name = "suite_constants"
path = "tests/suites/constants/mod.rs"

[[test]]
name = "suite_memory"
path = "tests/suites/memory/mod.rs"

[[test]]
name = "suite_ownership"
path = "tests/suites/ownership/mod.rs"

[[test]]
name = "suite_regions"
path = "tests/suites/regions/mod.rs"

[[test]]
name = "suite_projections"
path = "tests/suites/projections/mod.rs"

[[test]]
name = "suite_inference"
path = "tests/suites/inference/mod.rs"

[[test]]
name = "suite_lowering"
path = "tests/suites/lowering/mod.rs"

[[test]]
name = "suite_declarations"
path = "tests/suites/declarations/mod.rs"

[[test]]
name = "suite_traits"
path = "tests/suites/traits/mod.rs"
